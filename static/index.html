<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split — stem separator</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e1013">
</head>
<body>
<main>
  <header>
    <h1>split</h1>
    <p class="sub">Drop in a song, get the stems back.</p>
  </header>

  <section id="upload-card" class="card">
    <div id="dropzone" class="dropzone" tabindex="0" role="button"
         aria-label="Choose an audio file or drop one here">
      <svg class="dz-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 16V4m0 0L8 8m4-4 4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      <p class="dz-main">Drop an audio file here</p>
      <p class="dz-sub">or click to choose &middot; audio or video, most formats</p>
      <input type="file" id="file-input" accept="audio/*,video/*" hidden>
    </div>

    <p class="controls-note">
      Six stems &mdash; vocals, drums, bass, guitar, piano, other.
      Runs entirely in this browser; nothing is uploaded.
    </p>
  </section>

  <section id="progress-card" class="card hidden">
    <div class="progress-head">
      <span id="progress-name" class="track-name"></span>
      <span id="progress-elapsed" class="elapsed"></span>
    </div>
    <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    <p id="progress-stage" class="stage"></p>
  </section>

  <section id="error-card" class="card error hidden">
    <p id="error-text"></p>
    <button id="error-dismiss" class="btn ghost">Try another file</button>
  </section>

  <section id="player-card" class="card hidden">
    <div class="player-head">
      <div>
        <span id="player-name" class="track-name"></span>
        <span id="player-meta" class="meta"></span>
      </div>
      <div class="head-actions">
        <button id="download-mix" class="btn">Download this mix</button>
        <button id="download-all" class="btn ghost">All stems (.zip)</button>
      </div>
    </div>

    <div class="transport">
      <button id="play-btn" class="play-btn" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <div id="scrub" class="scrub"><div id="scrub-fill" class="scrub-fill"></div></div>
      <span id="time" class="time">0:00 / 0:00</span>
    </div>

    <div id="stems" class="stems"></div>

    <p class="hint">Click a waveform to seek. <kbd>Space</kbd> play/pause.</p>
  </section>
</main>

<script src="/coi-serviceworker.js"></script>
<script src="/player.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
